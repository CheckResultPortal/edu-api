services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: edu_api
      POSTGRES_PASSWORD: edu_api
      POSTGRES_USER: edu_api
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edu_api -d edu_api']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
