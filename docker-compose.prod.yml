# =============================================================================
# EduVoucher production stack for Coolify
#
# In Coolify: Applications → New → Docker Compose
# Point to this file (docker-compose.prod.yml) and set environment variables
# in the Coolify UI. Coolify injects them at runtime.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_api}
      POSTGRES_USER: ${POSTGRES_USER:-edu_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-edu_api} -d ${POSTGRES_DB:-edu_api}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  public-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: public-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: public-api
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-edu_api}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_api}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      ORDER_PRIVACY_HMAC_KEY: ${ORDER_PRIVACY_HMAC_KEY}
      ORDER_IDEMPOTENCY_TTL_MS: ${ORDER_IDEMPOTENCY_TTL_MS:-86400000}
      ORDER_RATE_LIMIT_WINDOW_MS: ${ORDER_RATE_LIMIT_WINDOW_MS:-600000}
      ORDER_RATE_LIMIT_IP_MAXIMUM: ${ORDER_RATE_LIMIT_IP_MAXIMUM:-30}
      ORDER_RATE_LIMIT_PHONE_MAXIMUM: ${ORDER_RATE_LIMIT_PHONE_MAXIMUM:-10}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co/}
      PAYSTACK_REQUEST_TIMEOUT_MS: ${PAYSTACK_REQUEST_TIMEOUT_MS:-10000}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}
      PAYMENT_IDEMPOTENCY_TTL_MS: ${PAYMENT_IDEMPOTENCY_TTL_MS:-86400000}
      PAYMENT_INITIAL_VERIFICATION_DELAY_MS: ${PAYMENT_INITIAL_VERIFICATION_DELAY_MS:-120000}
      PAYMENT_RATE_LIMIT_WINDOW_MS: ${PAYMENT_RATE_LIMIT_WINDOW_MS:-600000}
      PAYMENT_RATE_LIMIT_IP_MAXIMUM: ${PAYMENT_RATE_LIMIT_IP_MAXIMUM:-30}
      PAYMENT_RATE_LIMIT_ORDER_MAXIMUM: ${PAYMENT_RATE_LIMIT_ORDER_MAXIMUM:-10}
      USSD_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: admin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: admin-api
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-edu_api}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_api}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      ADMIN_APPLICATION_ORIGIN: ${ADMIN_APPLICATION_ORIGIN}
      ADMIN_SESSION_HMAC_KEY: ${ADMIN_SESSION_HMAC_KEY}
      ADMIN_SECRET_ENCRYPTION_KEY_ID: ${ADMIN_SECRET_ENCRYPTION_KEY_ID}
      ADMIN_SECRET_ENCRYPTION_KEY: ${ADMIN_SECRET_ENCRYPTION_KEY}
      VOUCHER_SECRET_ENCRYPTION_KEY_ID: ${VOUCHER_SECRET_ENCRYPTION_KEY_ID}
      VOUCHER_SECRET_ENCRYPTION_KEY: ${VOUCHER_SECRET_ENCRYPTION_KEY}
      VOUCHER_PIN_FINGERPRINT_KEY: ${VOUCHER_PIN_FINGERPRINT_KEY}
      VOUCHER_IMPORT_CHUNK_SIZE: ${VOUCHER_IMPORT_CHUNK_SIZE:-1000}
      VOUCHER_IMPORT_MAX_BYTES: ${VOUCHER_IMPORT_MAX_BYTES:-67108864}
      VOUCHER_IMPORT_STALE_AFTER_MS: ${VOUCHER_IMPORT_STALE_AFTER_MS:-900000}
      VOUCHER_IMPORT_RECOVERY_POLL_INTERVAL_MS: ${VOUCHER_IMPORT_RECOVERY_POLL_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-edu_api}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_api}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-log}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co/}
      PAYSTACK_REQUEST_TIMEOUT_MS: ${PAYSTACK_REQUEST_TIMEOUT_MS:-10000}
      PAYMENT_VERIFICATION_BATCH_SIZE: ${PAYMENT_VERIFICATION_BATCH_SIZE:-25}
      PAYMENT_VERIFICATION_LEASE_MS: ${PAYMENT_VERIFICATION_LEASE_MS:-60000}
      PAYMENT_VERIFICATION_MAX_ATTEMPTS: ${PAYMENT_VERIFICATION_MAX_ATTEMPTS:-12}
      PAYMENT_VERIFICATION_BASE_DELAY_MS: ${PAYMENT_VERIFICATION_BASE_DELAY_MS:-60000}
      PAYMENT_RECOVERY_POLL_INTERVAL_MS: ${PAYMENT_RECOVERY_POLL_INTERVAL_MS:-30000}
      PAYMENT_IDEMPOTENCY_CLEANUP_BATCH_SIZE: ${PAYMENT_IDEMPOTENCY_CLEANUP_BATCH_SIZE:-1000}
      ORDER_IDEMPOTENCY_CLEANUP_BATCH_SIZE: ${ORDER_IDEMPOTENCY_CLEANUP_BATCH_SIZE:-1000}
      ORDER_IDEMPOTENCY_CLEANUP_POLL_INTERVAL_MS: ${ORDER_IDEMPOTENCY_CLEANUP_POLL_INTERVAL_MS:-60000}
      ADMIN_APPLICATION_ORIGIN: ${ADMIN_APPLICATION_ORIGIN}
      ADMIN_SESSION_HMAC_KEY: ${ADMIN_SESSION_HMAC_KEY}
      ADMIN_SECRET_ENCRYPTION_KEY_ID: ${ADMIN_SECRET_ENCRYPTION_KEY_ID}
      ADMIN_SECRET_ENCRYPTION_KEY: ${ADMIN_SECRET_ENCRYPTION_KEY}
      VOUCHER_SECRET_ENCRYPTION_KEY_ID: ${VOUCHER_SECRET_ENCRYPTION_KEY_ID}
      VOUCHER_SECRET_ENCRYPTION_KEY: ${VOUCHER_SECRET_ENCRYPTION_KEY}
      VOUCHER_PIN_FINGERPRINT_KEY: ${VOUCHER_PIN_FINGERPRINT_KEY}
      VOUCHER_IMPORT_CHUNK_SIZE: ${VOUCHER_IMPORT_CHUNK_SIZE:-1000}
      VOUCHER_IMPORT_MAX_BYTES: ${VOUCHER_IMPORT_MAX_BYTES:-67108864}
      VOUCHER_IMPORT_STALE_AFTER_MS: ${VOUCHER_IMPORT_STALE_AFTER_MS:-900000}
      VOUCHER_IMPORT_RECOVERY_POLL_INTERVAL_MS: ${VOUCHER_IMPORT_RECOVERY_POLL_INTERVAL_MS:-60000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      MOOLRE_SMS_VAS_KEY: ${MOOLRE_SMS_VAS_KEY}
      MOOLRE_SMS_SENDER_ID: ${MOOLRE_SMS_SENDER_ID}
      CUSTOMER_SUPPORT_PHONE: ${CUSTOMER_SUPPORT_PHONE}
      MOOLRE_SMS_BASE_URL: ${MOOLRE_SMS_BASE_URL:-https://api.moolre.com}
      MOOLRE_SMS_REQUEST_TIMEOUT_MS: ${MOOLRE_SMS_REQUEST_TIMEOUT_MS:-10000}
      VOUCHER_DELIVERY_BATCH_SIZE: ${VOUCHER_DELIVERY_BATCH_SIZE:-25}
      VOUCHER_DELIVERY_POLL_INTERVAL_MS: ${VOUCHER_DELIVERY_POLL_INTERVAL_MS:-5000}
      VOUCHER_DELIVERY_PROCESSING_LEASE_MS: ${VOUCHER_DELIVERY_PROCESSING_LEASE_MS:-120000}
      VOUCHER_DELIVERY_MAX_ATTEMPTS: ${VOUCHER_DELIVERY_MAX_ATTEMPTS:-5}
      VOUCHER_DELIVERY_RETRY_BASE_DELAY_MS: ${VOUCHER_DELIVERY_RETRY_BASE_DELAY_MS:-5000}
      VOUCHER_DELIVERY_RETRY_MAX_DELAY_MS: ${VOUCHER_DELIVERY_RETRY_MAX_DELAY_MS:-300000}
      ADMIN_INVITATION_EMAIL_MAX_ATTEMPTS: ${ADMIN_INVITATION_EMAIL_MAX_ATTEMPTS:-5}
      ADMIN_INVITATION_EMAIL_BATCH_SIZE: ${ADMIN_INVITATION_EMAIL_BATCH_SIZE:-25}
      ADMIN_INVITATION_EMAIL_POLL_INTERVAL_MS: ${ADMIN_INVITATION_EMAIL_POLL_INTERVAL_MS:-5000}
      VOUCHER_ALLOCATION_OUTBOX_BATCH_SIZE: ${VOUCHER_ALLOCATION_OUTBOX_BATCH_SIZE:-10}
      VOUCHER_ALLOCATION_POLL_INTERVAL_MS: ${VOUCHER_ALLOCATION_POLL_INTERVAL_MS:-5000}
      VOUCHER_ALLOCATION_LEASE_MS: ${VOUCHER_ALLOCATION_LEASE_MS:-120000}
      VOUCHER_ALLOCATION_MAX_ATTEMPTS: ${VOUCHER_ALLOCATION_MAX_ATTEMPTS:-5}
      VOUCHER_ALLOCATION_RETRY_BASE_DELAY_MS: ${VOUCHER_ALLOCATION_RETRY_BASE_DELAY_MS:-5000}
      VOUCHER_ALLOCATION_RETRY_MAX_DELAY_MS: ${VOUCHER_ALLOCATION_RETRY_MAX_DELAY_MS:-300000}
      RESTOCK_DRAIN_OUTBOX_BATCH_SIZE: ${RESTOCK_DRAIN_OUTBOX_BATCH_SIZE:-10}
      RESTOCK_DRAIN_CHUNK_SIZE: ${RESTOCK_DRAIN_CHUNK_SIZE:-250}
      RESTOCK_DRAIN_RECOVERY_PRODUCT_BATCH_SIZE: ${RESTOCK_DRAIN_RECOVERY_PRODUCT_BATCH_SIZE:-10}
      RESTOCK_DRAIN_POLL_INTERVAL_MS: ${RESTOCK_DRAIN_POLL_INTERVAL_MS:-5000}
      RESTOCK_DRAIN_LEASE_MS: ${RESTOCK_DRAIN_LEASE_MS:-120000}
      RESTOCK_DRAIN_MAX_ATTEMPTS: ${RESTOCK_DRAIN_MAX_ATTEMPTS:-5}
      RESTOCK_DRAIN_RETRY_BASE_DELAY_MS: ${RESTOCK_DRAIN_RETRY_BASE_DELAY_MS:-5000}
      RESTOCK_DRAIN_RETRY_MAX_DELAY_MS: ${RESTOCK_DRAIN_RETRY_MAX_DELAY_MS:-300000}
      STOCK_MONITORING_PRODUCT_BATCH_SIZE: ${STOCK_MONITORING_PRODUCT_BATCH_SIZE:-100}
      STOCK_MONITORING_POLL_INTERVAL_MS: ${STOCK_MONITORING_POLL_INTERVAL_MS:-5000}
      STOCK_ALERT_OUTBOX_BATCH_SIZE: ${STOCK_ALERT_OUTBOX_BATCH_SIZE:-25}
      STOCK_ALERT_OUTBOX_LEASE_MS: ${STOCK_ALERT_OUTBOX_LEASE_MS:-120000}
      RECONCILIATION_BATCH_SIZE: ${RECONCILIATION_BATCH_SIZE:-50}
      RECONCILIATION_POLL_INTERVAL_MS: ${RECONCILIATION_POLL_INTERVAL_MS:-60000}
      USSD_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
