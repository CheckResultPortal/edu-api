name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eduvoucher
          POSTGRES_USER: eduvoucher
          POSTGRES_PASSWORD: eduvoucher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduvoucher -d eduvoucher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
      - run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
      - run: pnpm exec nx sync:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec nx run public-api-e2e:e2e
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          LOG_LEVEL: error
          SERVICE_NAME: public-api
          PORT: 3001
          ORDER_PRIVACY_HMAC_KEY: "0123456789012345678901234567890123456789012"
          PAYSTACK_SECRET_KEY: "sk_test_012345678901234567890123456789"
          PAYSTACK_CALLBACK_URL: "http://localhost:3000/payment/callback"
          USSD_ENABLED: "false"
      - run: pnpm exec nx run admin-api-e2e:e2e
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          LOG_LEVEL: error
          SERVICE_NAME: admin-api
          PORT: 3002
          ADMIN_APPLICATION_ORIGIN: "https://admin.example.com"
          ADMIN_SESSION_HMAC_KEY: "0123456789012345678901234567890123456789012"
          ADMIN_SECRET_ENCRYPTION_KEY_ID: test-v1
          ADMIN_SECRET_ENCRYPTION_KEY: "0123456789012345678901234567890123456789012"
          VOUCHER_SECRET_ENCRYPTION_KEY_ID: test-v1
          VOUCHER_SECRET_ENCRYPTION_KEY: "1234567890123456789012345678901234567890123"
          VOUCHER_PIN_FINGERPRINT_KEY: "abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG"
      - run: pnpm exec nx run worker-e2e:e2e
        env:
          DATABASE_URL: postgresql://eduvoucher:eduvoucher@localhost:5432/eduvoucher?schema=public
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          LOG_LEVEL: error
      - run: pnpm build
